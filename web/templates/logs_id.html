<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="/static/style.css" rel="stylesheet" type="text/css">

	<title>Open Combat Logs</title>
</head>
<body>
	{{ template "header" .Header }}
	{{ template "sidebar" . }}
	<main>
		<table>
		{{ $logID := .ID }}
		{{ range .Entries }}
			<tr >
				<td><a href="/logs/{{ $logID }}/{{ .ID }}">{{ .Name }}</a></td>
				<td><a href="/logs/{{ $logID }}/{{ .ID }}">{{ .Duration }}</a></td>
				<td><a href="/logs/{{ $logID }}/{{ .ID }}">{{ .Success }}</a></td>
			</tr>
		{{ end }}
		</table>
	</main>
</body>
</html>
