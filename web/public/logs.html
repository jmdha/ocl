<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Open Combat Logs</title>

<style>
{{ template "style" }}
</style>
</head>
<body>
	{{ template "header" .Header }}
	<main>
		<table>
			{{ range .Entries }}
			<tr>
				<td><a href="/logs/{{ .ID }}">{{ .Date.Format "2006-01-02 15:04:05" }}</a></td>
			</tr>
			{{ end }}
		</table>
	</main>
	{{ template "footer" .Footer }}
</body>
</html>
