<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Open Combat Logs</title>

<style>
{{ template "style" }}
</style>
</head>
<body>
	{{ template "header" }}
	<main>
		<table>
		{{ $logID := .ID }}
		{{ range .Entries }}
			<tr>
				<td><a href="/logs/{{ $logID }}/{{ .ID }}">{{ .Name }}</a></td>
				<td><a href="/logs/{{ $logID }}/{{ .ID }}">{{ .Duration }}</a></td>
				<td><a href="/logs/{{ $logID }}/{{ .ID }}">{{ .Success }}</a></td>
			</tr>
		{{ end }}
		</table>
	</main>
</body>
</html>
